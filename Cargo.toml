[workspace]
resolver = "3"
members = ["crates/basic-pitch-rs", "crates/basic-pitch-cli", "crates/parity", "examples/wasm"]
default-members = ["crates/basic-pitch-rs", "crates/basic-pitch-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "Apache-2.0"
authors = ["Adrien Thevon"]
repository = "https://github.com/AThevon/basic-pitch-rs"

[workspace.dependencies]
basic-pitch-rs = { path = "crates/basic-pitch-rs", version = "0.1.0" }
ndarray = "0.17.2"
tract-onnx = { version = "0.23.9", default-features = false }
ort = { version = "=2.0.0-rc.14", default-features = false }
midly = { version = "0.5.3", default-features = false, features = ["alloc"] }
thiserror = "2.0.21"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
indicatif = "0.18.6"
symphonia = { version = "0.6.1", default-features = false }
rubato = "5.0.1"
soxr-sys = "0.1.3"
ndarray-npy = { version = "0.10.0", default-features = false }
tempfile = "3.27.0"
jsonschema = { version = "0.59.0", default-features = false }
sha2 = "0.11.1"
wasm-bindgen = "0.2.129"
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
hound = "3.5.1"

[profile.release]
lto = "thin"
codegen-units = 1

# tract is about 20 times slower without optimizations. Optimizing the dependencies
# keeps debug builds and `cargo test` (which runs the model) fast.
[profile.dev.package."*"]
opt-level = 3

# The WebAssembly demo (examples/wasm/build.sh). Optimizing for size makes the module
# about 35% smaller than with `release`, for about 20% more inference time.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = "fat"
strip = true
