name: Publish

# Publishes the library, then the CLI, to crates.io when a GitHub release is published
# (the draft created by release.yml, once a maintainer reviews and publishes it).
# Authentication uses crates.io trusted publishing: no token is stored in the repository.

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: crates-io
    permissions:
      id-token: write # exchanged for a short-lived crates.io token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Check that the tag matches the workspace version
        id: version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match the workspace version ${version}"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      # A version published by hand (0.1.0 was) is skipped instead of failing.
      - name: Skip versions already on crates.io
        id: check
        run: |
          status="$(curl -s -o /dev/null -w '%{http_code}' -A 'basic-pitch-rs publish workflow' \
            "https://crates.io/api/v1/crates/basic-pitch-cli/${{ steps.version.outputs.version }}")"
          if [ "$status" = 200 ]; then
            echo "already published, nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        if: steps.check.outputs.skip != 'true'
        id: auth
      - name: Publish basic-pitch-rs and basic-pitch-cli
        if: steps.check.outputs.skip != 'true'
        run: cargo publish -p basic-pitch-rs -p basic-pitch-cli --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
